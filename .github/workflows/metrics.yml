# Option reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule:
    - cron: "43 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The action commits to an existing branch only, so create the orphan render branch once.
      - name: Ensure render branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-renders >/dev/null; then
            exit 0
          fi
          git init -q render && cd render
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q --orphan metrics-renders
          printf '# Metrics renders\n' > README.md
          git add README.md
          git commit -qm "chore: initialize metrics renders"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics-renders

      # GITHUB_TOKEN only sees this repository, so repository totals and languages would render as
      # zeros. They switch on once a METRICS_TOKEN secret (fine-grained PAT, public repos read-only)
      # exists; the render still commits with GITHUB_TOKEN (committer_token default).
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          output_action: commit
          output_condition: data-changed
          committer_branch: metrics-renders
          template: classic
          base: ${{ secrets.METRICS_TOKEN != '' && 'header, activity, community, repositories' || 'header, activity, community' }}
          config_timezone: Europe/Berlin
          config_display: large
          plugin_languages: ${{ secrets.METRICS_TOKEN != '' }}
          # Unity shader and generated web assets would otherwise dominate the language bar.
          plugin_languages_ignored: shaderlab, hlsl, css, html, jinja
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_followup: yes
          plugin_followup_sections: user
